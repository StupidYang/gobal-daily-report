name: Retired source installer - read-only audit
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          test -f maintenance/acceptance-r5/applied.json
          echo 'Source repair is installed. This retired entry cannot apply old patches or deploy.'
          node --test tests/*.test.cjs
          node scripts/check-runtime.cjs
          node scripts/check-published.cjs
          echo 'Validate and publish candidates is the maintained publisher.'
