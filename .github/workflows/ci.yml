name: Isolated regression checks
on:
  workflow_dispatch:
  push:
    branches: ['repair/staging-20260922']
    paths: ['.github/workflows/ci.yml']
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: gdr-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Export exact reviewed source for offline reproduction
        run: |
          mkdir -p /tmp/gdr-regression
          git archive --format=zip --output=/tmp/gdr-regression/source.zip HEAD
          git rev-parse HEAD > /tmp/gdr-regression/commit.txt
      - name: Run existing regression suite without production writes
        run: |
          set -o pipefail
          node --test tests/*.test.cjs | tee /tmp/gdr-regression/unit-tests.tap
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gdr-regression-proof
          path: /tmp/gdr-regression/
          retention-days: 7
          if-no-files-found: error
