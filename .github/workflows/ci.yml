name: Isolated regression checks
on:
  push:
    branches: ['repair/incident-20260923']
permissions:
  contents: read
  actions: read
concurrency:
  group: gdr-incident-${{ github.ref }}
  cancel-in-progress: true
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read-only incident snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/gdr-incident/logs
          git archive --format=zip --output=/tmp/gdr-incident/source.zip HEAD
          git rev-parse HEAD > /tmp/gdr-incident/commit.txt
          gh api "repos/$GITHUB_REPOSITORY/zipball/gdr-runtime" > /tmp/gdr-incident/runtime.zip
          gh api "repos/$GITHUB_REPOSITORY/actions/runs?per_page=100" --jq '{total_count,runs:[.workflow_runs[]|{id,name,head_sha,head_branch,display_title,event,status,conclusion,created_at,updated_at,html_url}]}' > /tmp/gdr-incident/runs.json
          gh api "repos/$GITHUB_REPOSITORY/commits?per_page=30" --jq '[.[]|{sha,date:.commit.committer.date,message:.commit.message}]' > /tmp/gdr-incident/commits.json
          python3 - <<'PY'
          import json, pathlib, subprocess, concurrent.futures
          root=pathlib.Path('/tmp/gdr-incident')
          runs=json.loads((root/'runs.json').read_text())['runs']
          selected=[r for r in runs if r['conclusion']=='failure' and r['created_at']>='2026-09-23T06:00:00Z'][:12]
          def capture(r):
              repo='StupidYang/gobal-daily-report'
              jobs=subprocess.check_output(['gh','api',f'repos/{repo}/actions/runs/{r["id"]}/jobs'])
              (root/'logs'/f'{r["id"]}-jobs.json').write_bytes(jobs)
              for j in json.loads(jobs)['jobs']:
                  if j['conclusion']=='failure':
                      p=subprocess.run(['gh','api',f'repos/{repo}/actions/jobs/{j["id"]}/logs'],capture_output=True)
                      (root/'logs'/f'{r["id"]}-{j["id"]}.log').write_bytes(p.stdout or p.stderr)
          with concurrent.futures.ThreadPoolExecutor(max_workers=3) as pool:list(pool.map(capture,selected))
          PY
          set +e
          node --test tests/*.test.cjs > /tmp/gdr-incident/baseline-tests.tap 2>&1
          echo $? > /tmp/gdr-incident/baseline-tests-exit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gdr-incident-evidence
          path: /tmp/gdr-incident/
          retention-days: 7
          if-no-files-found: error
