name: Isolated regression checks
on:
  workflow_dispatch:
  push:
    branches: ['repair/staging-20260922']
permissions:
  contents: read
concurrency:
  group: gdr-live-readonly-probe
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 58dbb0bd07f1fb1b79b9ab592f3fd5abb8498444
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Export pinned source and baseline tests
        run: |
          mkdir -p /tmp/gdr-live-probe
          git archive --format=zip --output=/tmp/gdr-live-probe/source.zip HEAD
          git rev-parse HEAD > /tmp/gdr-live-probe/commit.txt
          node --test tests/*.test.cjs > /tmp/gdr-live-probe/baseline-tests.tap
      - name: Probe public sources with a hard time budget and no publication
        run: |
          date -u +%FT%TZ > /tmp/gdr-live-probe/started.txt
          timeout 180s node scripts/collect-public-quotes.cjs /tmp/gdr-live-probe/quotes.json > /tmp/gdr-live-probe/collector-summary.json 2>/tmp/gdr-live-probe/collector-errors.txt || echo "$?" > /tmp/gdr-live-probe/collector-exit.txt
          date -u +%FT%TZ > /tmp/gdr-live-probe/finished.txt
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gdr-live-probe-source
          path: /tmp/gdr-live-probe/
          retention-days: 7
          if-no-files-found: error
