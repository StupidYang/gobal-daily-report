name: Bounded collection and report handoff
on:
  push:
    branches: [gdr-runtime]
    paths: ['runtime/requests/*.json', 'runtime/submissions/*.json']
permissions:
  contents: write
  actions: write
jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve one immutable handoff from the exact pushed commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/route-execution-event.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gdr-execution-${{ github.run_id }}
          path: /tmp/gdr-execution/
          retention-days: 7
          if-no-files-found: warn
