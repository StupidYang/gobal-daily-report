name: Manual production batch audit
on:
  workflow_dispatch:
    inputs:
      batch_id:
        description: Published production atomic batch ID (never a fixture)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: gdr-manual-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit exact requested production batch
        env:
          BATCH_ID: ${{ inputs.batch_id }}
        run: |
          mkdir -p /tmp/gdr-audit
          node scripts/check-batch.cjs "$BATCH_ID" > /tmp/gdr-audit/batch.json
          node scripts/check-runtime.cjs
          node scripts/check-published.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-batch-audit
          path: /tmp/gdr-audit/
          retention-days: 14
