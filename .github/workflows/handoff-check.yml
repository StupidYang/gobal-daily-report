name: Handoff contract regression
on:
  push:
    branches: [repair/handoff-contract-20260923]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: gdr-handoff-regression
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply only the reviewed checksum-verified repair
        run: |
          mkdir -p /tmp/gdr-handoff
          if test -f .repair/handoff.patch.b64.1; then
            python3 - <<'PY'
          import pathlib,base64,gzip,hashlib,subprocess
          text=''.join(pathlib.Path('.repair/handoff.patch.b64.'+str(i)).read_text().strip() for i in (1,2,3))
          text=text.replace('A3HiBuOWWbkpyt','A3HiBuOWbkpyt')
          pathlib.Path('/tmp/gdr-handoff/transferred.b64').write_text(text)
          data=base64.b64decode(text,validate=True)
          assert hashlib.sha256(data).hexdigest()=='f56cfd60210746806305dc3f9d939e4f052b2e675cc7040146858703a7031c4e', 'Repair transfer checksum mismatch'
          patch=pathlib.Path('/tmp/gdr-handoff/repair.patch');patch.write_bytes(gzip.decompress(data))
          subprocess.run(['git','apply','--check',str(patch)],check=True)
          subprocess.run(['git','apply',str(patch)],check=True)
          PY
          fi
      - name: Preserve exact original native failure inputs as fixed regression fixtures
        run: |
          if ! test -f tests/fixtures/native-handoff/baseline.json; then
            git fetch origin f15f65e425187bae6144dc7978e5e9a5c0c7b880 --depth=1
            git fetch origin a9b5b040b223d8f6d16216ebc2e3303614f75ea2 --depth=1
            node <<'JS'
          const fs=require('node:fs'),cp=require('node:child_process'),crypto=require('node:crypto');
          const dir='tests/fixtures/native-handoff',base='f15f65e425187bae6144dc7978e5e9a5c0c7b880',runtime='a9b5b040b223d8f6d16216ebc2e3303614f75ea2';fs.mkdirSync(dir,{recursive:true});
          const read=p=>JSON.parse(cp.execFileSync('git',['show',base+':'+p],{encoding:'utf8',maxBuffer:8*1024*1024}));
          const roles=['quotes','asia-equities','us-equities','news','macro','research','synthesis'];
          fs.writeFileSync(dir+'/baseline.json',JSON.stringify({config:read('config/watchlist.json'),latest:read('data/latest.json'),modules:Object.fromEntries(roles.map(r=>[r,read('data/modules/'+r+'.json')]))},null,2)+'\n');
          for(const id of ['20260923T145853-global-main','20260923T153900-asia-session'])for(const [kind,suffix]of [['results',''],['submissions','-submission']])fs.writeFileSync(dir+'/'+id+suffix+'.json',cp.execFileSync('git',['show',runtime+':runtime/'+kind+'/'+id+'.json'],{maxBuffer:8*1024*1024}));
          JS
          fi
      - name: Validate pause bindings, all tests and exact failed submissions
        run: |
          node scripts/check-runtime.cjs
          node scripts/gdr.cjs check-config
          for f in assets/*.js lib/*.cjs scripts/*.cjs; do node --check "$f"; done
          node --test tests/*.test.cjs > /tmp/gdr-handoff/tests.tap
          node scripts/check-handoff-replay.cjs /tmp/gdr-handoff
          git diff --exit-code -- data/latest.json data/history-index.json data/modules data/runs data/receipts history
      - name: Install browser and Chinese fonts
        run: |
          npm install --prefix "$RUNNER_TEMP/gdr-browser" --no-save playwright@1.55.0
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk >/dev/null
          if ! command -v google-chrome >/dev/null; then "$RUNNER_TEMP/gdr-browser/node_modules/.bin/playwright" install --with-deps chromium; fi
      - name: Exercise both original native handoff reports at mobile and desktop widths
        env:
          NODE_PATH: ${{ runner.temp }}/gdr-browser/node_modules
        run: |
          python3 -m http.server 8183 --bind 127.0.0.1 --directory /tmp/gdr-handoff/site-global >/tmp/gdr-global-http.log 2>&1 &
          python3 -m http.server 8184 --bind 127.0.0.1 --directory /tmp/gdr-handoff/site-asia >/tmp/gdr-asia-http.log 2>&1 &
          GDR_TEST_URL=http://127.0.0.1:8183/ GDR_UI_OUTPUT=/tmp/gdr-handoff/browser-global node tests/ui-handoff.cjs
          GDR_TEST_URL=http://127.0.0.1:8184/ GDR_UI_OUTPUT=/tmp/gdr-handoff/browser-asia node tests/ui-handoff.cjs
      - name: Commit only tested source changes to the repair branch
        run: |
          rm -rf .repair
          git config user.name 'gdr-repair[bot]'
          git config user.email 'gdr-repair@users.noreply.github.com'
          git add -- assets automation docs index.html lib scripts tests .repair
          if ! git diff --cached --quiet; then
            git commit -m 'fix: canonical handoff, retained regional data, bounded editorial revision and visible execution status [skip ci]'
            git push origin HEAD:repair/handoff-contract-20260923
          fi
          git rev-parse HEAD > /tmp/gdr-handoff/tested-commit.txt
          git archive --format=zip --output=/tmp/gdr-handoff/tested-source.zip HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gdr-handoff-proof
          path: /tmp/gdr-handoff/
          retention-days: 7
          if-no-files-found: error
