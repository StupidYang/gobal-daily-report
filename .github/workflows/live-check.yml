name: Manual real-source preview checks
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify code and existing preview without regenerating analysis or writing production
        run: |
          mkdir -p /tmp/gdr-preview-check
          node scripts/gdr.cjs check-config
          node scripts/check-runtime.cjs
          node --test tests/*.test.cjs > /tmp/gdr-preview-check/unit-tests.tap
          git rev-parse HEAD > /tmp/gdr-preview-check/commit.txt
          cp docs/live-lock-proof.json /tmp/gdr-preview-check/previous-live-cas-proof.json
          cp validation/data/validation-result.json /tmp/gdr-preview-check/preview-origin.json
          git archive --format=zip --output=/tmp/gdr-preview-check/source.zip HEAD
          git diff --exit-code
      - name: Install browser
        run: |
          npm install --prefix "$RUNNER_TEMP/gdr-browser" --no-save playwright@1.55.0
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk >/dev/null
          if ! command -v google-chrome >/dev/null; then "$RUNNER_TEMP/gdr-browser/node_modules/.bin/playwright" install --with-deps chromium; fi
      - name: Check the real-source fixed preview over HTTP
        env:
          NODE_PATH: ${{ runner.temp }}/gdr-browser/node_modules
          GDR_TEST_URL: http://127.0.0.1:8181/
          GDR_TEST_WIDTHS: '390,1440'
          GDR_UI_OUTPUT: /tmp/gdr-preview-check/browser
        run: |
          python3 -m http.server 8181 --bind 127.0.0.1 --directory validation >/tmp/gdr-preview-check/http.log 2>&1 &
          node tests/ui-real-data.cjs
          GDR_UI_OUTPUT=/tmp/gdr-preview-check/expanded node tests/ui-expanded.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gdr-manual-preview-check
          path: /tmp/gdr-preview-check/
          retention-days: 7
          if-no-files-found: error
