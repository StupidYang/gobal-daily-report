name: Validate and publish candidates
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'data/inbox/**'
      - 'assets/**'
      - 'config/**'
      - 'docs/**'
      - 'scripts/**'
      - 'lib/**'
      - 'tests/**'
      - 'automation/**'
      - 'index.html'
      - '.github/workflows/publish-candidates.yml'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: gdr-candidate-publisher
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: https://stupidyang.github.io/gobal-daily-report/
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect actual Pages mode without changing administration
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/gdr-publication
          gh api "repos/$GITHUB_REPOSITORY/pages" > /tmp/gdr-publication/pages-config.json
          node - <<'JS' >> "$GITHUB_OUTPUT"
          const p=require('/tmp/gdr-publication/pages-config.json');
          if(!['legacy','workflow'].includes(p.build_type))throw Error('Unsupported Pages build mode');
          if(p.build_type==='legacy'&&(p.source?.branch!=='main'||p.source?.path!=='/'))throw Error('Branch Pages must serve main root; ask owner before changing settings');
          console.log('mode='+p.build_type);
          JS
      - name: Install isolated browser dependencies before processing candidates
        run: |
          mkdir -p "$RUNNER_TEMP/gdr-browser"
          npm install --prefix "$RUNNER_TEMP/gdr-browser" --no-save playwright@1.55.0
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk >/dev/null
          if ! command -v google-chrome >/dev/null; then "$RUNNER_TEMP/gdr-browser/node_modules/.bin/playwright" install --with-deps chromium; fi
          mkdir -p /tmp/gdr-site
          python3 -m http.server 8181 --bind 127.0.0.1 --directory /tmp/gdr-site >/tmp/gdr-http.log 2>&1 &
      - name: Validate and render the complete candidate write set before committing; retry newer main
        env:
          GH_TOKEN: ${{ github.token }}
          NODE_PATH: ${{ runner.temp }}/gdr-browser/node_modules
          GDR_TEST_URL: http://127.0.0.1:8181/
          GDR_TEST_WIDTHS: '390,1440'
          GDR_UI_OUTPUT: /tmp/gdr-publication/staged
        run: |
          set -euo pipefail
          git config user.name 'gdr-publisher[bot]'
          git config user.email 'gdr-publisher@users.noreply.github.com'
          complete=0
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            node scripts/gdr.cjs check-config
            node scripts/check-runtime.cjs
            for f in assets/*.js lib/*.cjs scripts/*.cjs; do node --check "$f"; done
            node --test tests/*.test.cjs > /tmp/gdr-publication/unit-tests.tap
            node scripts/publication-lease.cjs claim
            node scripts/promote-candidates.cjs > /tmp/gdr-publication/receipts.json
            node scripts/check-published.cjs
            node scripts/build-reader-projections.cjs > /tmp/gdr-publication/content-quality.json
            node scripts/build-demo.cjs > /tmp/gdr-publication/demo.json
            cp automation/control.json data/runtime-control.json
            GDR_PERSIST_BUILD=1 node scripts/stage-site.cjs /tmp/gdr-site
            node tests/ui-real-data.cjs
            GDR_UI_OUTPUT=/tmp/gdr-publication/staged-content node tests/ui-content-quality.cjs
            GDR_UI_OUTPUT=/tmp/gdr-publication/staged-expanded node tests/ui-expanded.cjs
            git add -- data/modules data/runs data/receipts data/publication-status.json data/latest.json data/history-index.json data/build.json data/runtime-control.json data/reader-projections history demo
            if git diff --cached --quiet; then complete=1; break; fi
            git commit -m 'data: publish tested candidates and matching public build identity'
            node scripts/publication-lease.cjs verify
            if git push origin HEAD:main; then complete=1; break; fi
            sleep "$((attempt * 2))"
          done
          test "$complete" = 1
          node scripts/stage-site.cjs /tmp/gdr-site
          git rev-parse HEAD > /tmp/gdr-publication/commit.txt
          cp /tmp/gdr-site/data/build.json /tmp/gdr-publication/build.json
          cp data/publication-status.json /tmp/gdr-publication/publication-status.json
      - uses: actions/upload-pages-artifact@v4
        if: steps.pages.outputs.mode == 'workflow'
        with:
          path: /tmp/gdr-site
      - name: Deploy artifact only for workflow Pages
        if: steps.pages.outputs.mode == 'workflow'
        uses: actions/deploy-pages@v4
      - name: Request the existing branch build instead of competing artifact deployment
        if: steps.pages.outputs.mode == 'legacy'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/request-pages.cjs /tmp/gdr-site/data/build.json
      - name: Wait for exact public build identity
        env:
          GDR_TEST_URL: https://stupidyang.github.io/gobal-daily-report/
        run: node scripts/wait-site.cjs /tmp/gdr-site/data/build.json > /tmp/gdr-publication/readiness.json
      - name: Exercise the actual public site and verify all byte hashes
        env:
          NODE_PATH: ${{ runner.temp }}/gdr-browser/node_modules
          GDR_TEST_URL: https://stupidyang.github.io/gobal-daily-report/
          GDR_EXPECT_BUILD: /tmp/gdr-site/data/build.json
          GDR_TEST_WIDTHS: '390,1440'
          GDR_UI_OUTPUT: /tmp/gdr-publication/live
        run: node tests/ui-real-data.cjs
      - name: Verify all published detailed analyses, complete news and evidence links
        env:
          NODE_PATH: ${{ runner.temp }}/gdr-browser/node_modules
          GDR_TEST_URL: https://stupidyang.github.io/gobal-daily-report/
          GDR_EXPECT_BUILD: /tmp/gdr-site/data/build.json
          GDR_TEST_WIDTHS: '390,1440'
          GDR_UI_OUTPUT: /tmp/gdr-publication/live-expanded
        run: |
          node tests/ui-expanded.cjs
          GDR_UI_OUTPUT=/tmp/gdr-publication/live-content node tests/ui-content-quality.cjs
      - name: Verify deployed synthetic demonstration separately
        env:
          NODE_PATH: ${{ runner.temp }}/gdr-browser/node_modules
          GDR_TEST_URL: https://stupidyang.github.io/gobal-daily-report/demo/
          GDR_EXPECT_BUILD: /tmp/gdr-site/demo/data/build.json
          GDR_TEST_WIDTHS: '390,1440'
          GDR_UI_OUTPUT: /tmp/gdr-publication/live-demo
        run: |
          node tests/ui-real-data.cjs
          GDR_UI_OUTPUT=/tmp/gdr-publication/live-demo-expanded node tests/ui-expanded.cjs
      - name: Record execution result using the committed receipt, not console success
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publication-lease.cjs finish
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gdr-publication-proof
          path: /tmp/gdr-publication/
          retention-days: 14
          if-no-files-found: error
