name: Quote evidence
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/quote-evidence.yml','scripts/collect-public-quotes.cjs']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/collect-public-quotes.cjs /tmp/gdr-quotes-evidence.json
      - uses: actions/upload-artifact@v4
        with:
          name: quote-evidence
          path: /tmp/gdr-quotes-evidence.json
          if-no-files-found: error
          retention-days: 3
