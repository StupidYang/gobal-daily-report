name: Reader checks
on:
  push:
    paths:
      - 'assets/**'
      - 'tests/**'
      - 'scripts/**'
      - 'docs/**'
      - 'index.html'
      - 'data/latest.json'
      - '.github/workflows/reader-checks.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: reader-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check assets/terminal-core.js
          node --check assets/reader-core.js
          node --check assets/reader.js
          node --check scripts/validate-report.cjs
      - name: Run regression tests
        run: node --test tests/*.test.cjs
      - name: Validate report structure and evidence references
        run: node scripts/validate-report.cjs data/latest.json
