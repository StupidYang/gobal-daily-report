name: UI rendering evidence
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/ui-proof.yml'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test library
        run: |
          mkdir -p "$RUNNER_TEMP/gdr-browser"
          npm install --prefix "$RUNNER_TEMP/gdr-browser" --no-save playwright@1.55.0
          if ! command -v google-chrome >/dev/null; then "$RUNNER_TEMP/gdr-browser/node_modules/.bin/playwright" install --with-deps chromium; fi
      - name: Capture live and repository rendering
        env:
          NODE_PATH: ${{ runner.temp }}/gdr-browser/node_modules
        run: |
          mkdir -p /tmp/gdr-ui-proof
          git archive --format=zip HEAD > /tmp/gdr-ui-proof/repository.zip
          git rev-parse HEAD > /tmp/gdr-ui-proof/commit.txt
          python3 -m http.server 8181 --bind 127.0.0.1 > /tmp/gdr-http.log 2>&1 &
          node <<'NODE'
          const fs=require('node:fs');
          const {chromium}=require('playwright');
          (async()=>{
            const options={headless:true};
            if(fs.existsSync('/usr/bin/google-chrome'))options.executablePath='/usr/bin/google-chrome';
            const browser=await chromium.launch(options);
            const results=[];
            for(const [label,url] of [['live','https://stupidyang.github.io/gobal-daily-report/'],['repository','http://127.0.0.1:8181/']]) {
              for(const width of [1440,390]) {
                const ctx=await browser.newContext({viewport:{width,height:1000},locale:'zh-CN',timezoneId:'Asia/Singapore'});
                const page=await ctx.newPage(),errors=[],failed=[];
                page.on('pageerror',e=>errors.push(e.message));
                page.on('response',r=>{if(r.status()>=400)failed.push({url:r.url(),status:r.status()});});
                const item={label,url,width,errors,failed};
                try {
                  const res=await page.goto(url,{waitUntil:'networkidle',timeout:45000});
                  item.httpStatus=res.status();await page.waitForTimeout(2000);
                  item.report=(await page.request.get(url+'data/latest.json')).ok()?await (await page.request.get(url+'data/latest.json')).json():null;
                  fs.writeFileSync('/tmp/gdr-ui-proof/'+label+'-'+width+'.txt',await page.locator('body').innerText());
                  await page.screenshot({path:'/tmp/gdr-ui-proof/'+label+'-'+width+'-top.png'});
                  await page.screenshot({path:'/tmp/gdr-ui-proof/'+label+'-'+width+'-full.png',fullPage:true});
                  item.dimensions=await page.evaluate(()=>({width:innerWidth,scrollWidth:document.documentElement.scrollWidth,height:document.documentElement.scrollHeight,objects:(document.body.innerText.match(/\[object Object\]/g)||[]).length}));
                  await page.evaluate(()=>{const d=document.getElementById('watchlist');if(d){d.open=true;d.scrollIntoView();}});
                  await page.waitForTimeout(300);
                  await page.screenshot({path:'/tmp/gdr-ui-proof/'+label+'-'+width+'-watch.png'});
                  fs.writeFileSync('/tmp/gdr-ui-proof/'+label+'-'+width+'-watch.txt',await page.locator('body').innerText());
                }catch(e){item.error=e.message;}
                delete item.report;
                results.push(item);await ctx.close();
              }
            }
            fs.writeFileSync('/tmp/gdr-ui-proof/results.json',JSON.stringify(results,null,2));
            console.log(JSON.stringify(results,null,2));await browser.close();
          })().catch(e=>{console.error(e);process.exitCode=1;});
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gdr-ui-proof
          path: /tmp/gdr-ui-proof
          retention-days: 3
