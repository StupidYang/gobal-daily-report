<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#10171c">
  <meta name="description" content="个人市场情报台：当前主线、24小时演化、数据质量与可复核的判断修订。">
  <title>GDR · 个人市场情报台</title>
  <link rel="stylesheet" href="./assets/terminal.css?v=20260922-r1">
  <script defer src="./assets/terminal-core.js?v=20260922-r1"></script>
  <script defer src="./assets/terminal.js?v=20260922-r1"></script>
</head>
<body>
  <a class="skip" href="#reportRoot">跳至报告正文</a>
  <header class="topbar">
    <div class="brand"><span class="brand-mark" aria-hidden="true">G</span><span>GDR<span class="brand-sub">MARKET INTELLIGENCE</span></span></div>
    <nav aria-label="阅读导航"><a href="#overview">总览</a><a href="#changes">变化</a><a href="#judgments">判断</a><a href="#research">详报</a></nav>
    <div class="actions"><button id="fontBtn" aria-pressed="false" title="切换大字阅读">大字</button><button id="refreshBtn" class="solid">检查新报告</button></div>
  </header>
  <main class="shell">
    <div class="edition-bar"><span>个人市场情报台 <span class="muted">/ UTC+8</span></span><label>报告版本 <select id="historySelect" aria-label="选择历史报告"><option value="data/latest.json">最新报告</option></select></label></div>
    <div id="feedback" class="feedback" role="status" aria-live="polite">正在读取报告；这里展示的是定时快照，不是实时行情。</div>
    <div id="pendingBar" class="pending" hidden><span>新报告已就绪，当前阅读位置保持不变。</span><button id="applyBtn">载入新报告</button></div>
    <div id="reportRoot"><div class="loading">正在整理事实、变化与判断…</div></div>
    <footer>GDR · 记录市场，也记录判断如何改变。<br>定时研究快照 · 不提供自动交易信号 · 数据缺口不等于市场无变化。</footer>
  </main>
  <noscript><p>此页面需要 JavaScript 读取报告。可在仓库 data/latest.json 中查看原始数据。</p></noscript>
</body>
</html>
